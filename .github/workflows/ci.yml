name: CI

# Three levels of Windows evidence exist and must not be confused
# (docs/release/ci.md):
#   1. the cross-target harness (Fedora/Linux, `pnpm rust:windows`)
#   2. native Windows CI — this workflow's `windows` and `windows-package` jobs
#   3. physical Windows validation — a person, a real machine; never CI
on:
  push:
    branches: [main, 'phase*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The reference platform. ubuntu-latest catches Linux regressions but is not
  # a Fedora test (different kernel, WebKitGTK, desktop and sensors).
  linux:
    name: Linux quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # Full history, for the attribution check below.
          fetch-depth: 0

      - name: Commit attribution
        run: sh scripts/check-git-attribution.sh HEAD

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # For the cross-target Windows harness (type-checks only, no linking).
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            tools/windows-check -> target
          key: linux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend format
        run: pnpm format:check

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # Level 1 evidence: still useful next to native CI — it is what a
      # Fedora developer runs before every commit.
      - name: Windows cross-target harness
        run: pnpm rust:windows

      - name: Windows cross-target harness clippy
        run: pnpm rust:windows:lint

      - name: Linux app build
        run: pnpm tauri build --no-bundle -- --locked

  # Level 2 evidence: the REAL crate and its `cfg(target_os = "windows")`
  # Tauri/Win32 glue, compiled and tested by MSVC on Windows.
  windows:
    name: Windows native quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend format
        run: pnpm format:check

      - name: Frontend tests
        run: pnpm test

      # The frontend bundle builds on Windows too (Vite, paths, line endings).
      - name: Frontend build
        run: pnpm build

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Set up Rust 1.77.2
        uses: dtolnay/rust-toolchain@1.77.2

      # The MSRV is a promise about the whole locked graph, on Windows too —
      # including the bundled SQLite C amalgamation compiled by MSVC.
      - name: MSRV check
        run: cargo +1.77.2 check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Summary
        shell: pwsh
        run: |
          @(
            "## PULSE Windows native CI",
            "",
            "| Check | Result |",
            "| --- | --- |",
            "| Frontend typecheck, lint, format, tests | PASS |",
            "| Native Rust compile (MSVC, incl. Win32 overlay glue) | PASS |",
            "| Rust tests | PASS |",
            "| Clippy | PASS |",
            "| MSRV 1.77.2 | PASS |",
            "",
            "Commit: ``${{ github.sha }}``",
            "",
            "**Physical Windows validation: NOT YET PERFORMED.**"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

  # The declared MSRV on the reference platform.
  msrv-linux:
    name: MSRV 1.77.2 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev

      - name: Set up Rust 1.77.2
        uses: dtolnay/rust-toolchain@1.77.2

      - name: MSRV check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: MSRV tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # Real installers, only once native Windows quality is green.
  windows-package:
    name: Windows package
    needs: [windows]
    uses: ./.github/workflows/windows-package.yml
