# The Windows cross-check harness.
#
# PULSE treats Windows and Fedora Linux as two first-class platforms, but the
# full application cannot be *built* for Windows from Fedora: `tauri-build`
# compiles a Windows resource file and needs a resource compiler (`llvm-rc`)
# that a stock Fedora toolchain does not ship.
#
# Everything PULSE writes itself, however, is tauri-free: `metrics/` and
# `platform/` depend only on `serde` and, on Windows, on the raw API bindings.
# This crate includes those two module trees verbatim — the same files, by
# path, never a copy — so `cargo check --target x86_64-pc-windows-msvc` type
# checks the real Windows code from a Fedora workstation:
#
#     cargo check --manifest-path tools/windows-check/Cargo.toml \
#       --target x86_64-pc-windows-msvc
#
# What it proves: the Windows CPU, memory and GPU providers, the DXGI and
# D3DKMT layers, the NVML loader and every metric declaration compile and type
# check for a real Windows target.
#
# What it does not prove: that they *work*. Nothing here executes on Windows.
# Runtime validation is a manual test on a Windows machine, and CI's
# `windows-latest` job builds and runs the whole crate.
[package]
name = "pulse-windows-check"
version = "0.1.0-dev"
description = "Type-checks PULSE's Windows platform code from a non-Windows host."
edition = "2021"
# Kept identical to src-tauri/Cargo.toml: the harness must refuse anything the
# application itself could not compile.
rust-version = "1.77.2"
license-file = "../../LICENSE"
publish = false

[lib]
name = "pulse_windows_check"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# KNOWN LIMITATION OF THIS HARNESS — SQLite is NOT the production configuration.
#
# The application uses `rusqlite` with `bundled`, which compiles SQLite's C
# amalgamation. For `x86_64-pc-windows-msvc` that needs MSVC's `cl.exe` and
# `lib.exe`, which do not exist on a Fedora host. This harness therefore
# depends on the same `rusqlite` version WITHOUT `bundled`, which compiles no C.
#
# What that still proves: every line of PULSE's Rust that talks to SQLite, and
# rusqlite / libsqlite3-sys themselves, type check for Windows.
# What it does NOT prove: that the bundled SQLite C code compiles with MSVC.
# That is left to a real Windows build (CI's `msrv` and `backend` jobs on
# `windows-latest`, or a Windows machine). Production Windows still uses the
# bundled SQLite; this substitution exists only in this harness.
rusqlite = "0.32"

# Kept in step with src-tauri/Cargo.toml. Not used for a Windows target, but
# declared so the manifests do not drift.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Kept in step with src-tauri: 0.1 for the 1.77.2 MSRV.
windows-version = "0.1"
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }
