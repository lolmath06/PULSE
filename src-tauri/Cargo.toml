[package]
name = "pulse"
version = "0.1.0-dev"
description = "A modular, cross-platform system monitoring dashboard for Windows and Fedora Linux."
authors = ["PULSE contributors"]
license-file = "../LICENSE"
repository = "https://github.com/pulse-monitor/pulse"
edition = "2021"
rust-version = "1.77.2"

# The library is where all application logic lives; `main.rs` is a thin shim.
# This keeps the crate unit-testable with plain `cargo test` and is also what
# Tauri's mobile targets expect.
[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The official Tauri opener, used from Rust only (no JavaScript permission is
# granted): opens the default browser for an explicit *Search online* click and
# reveals an executable in the file manager.
tauri-plugin-opener = "2"
# SHA-256 of an executable, only when the user asks for it (RustCrypto,
# already in the dependency graph through Tauri).
sha2 = "0.10"
# Local metric history (Phase 10). `bundled` compiles SQLite's own amalgamation
# (SQLite 3.46.0) into PULSE, so neither Fedora nor Windows needs a system
# `libsqlite3` or a `sqlite3.dll` beside the executable, and both platforms run
# the same SQLite version. No server, no network: one file in the app's local
# data directory.
#
# Pinned to 0.32 for the MSRV: rusqlite 0.32.1 / libsqlite3-sys 0.30.1 is the
# newest line that builds with Rust 1.77.2. From libsqlite3-sys 0.31 on, the
# crate uses `#[expect]` (Rust 1.81) and later `cfg_select!`; neither release
# declares a `rust-version`, so only a real 1.77.2 build reveals it. See
# docs/development/msrv.md before raising this.
rusqlite = { version = "0.32", features = ["bundled"] }

# --- platform-specific dependencies ---------------------------------------
# Each OS pulls only what it needs; neither list is compiled on the other
# platform, so a Windows-only crate can never break a Fedora build.

[target.'cfg(target_os = "linux")'.dependencies]
# Raw libc bindings only, for the two Unix interfaces PULSE needs and `std`
# does not expose: `statvfs` (filesystem space) and `ioctl` (the read-only NVMe
# admin passthrough). No wrapper layer and no runtime — declaring these by hand
# would mean hand-rolling `struct statvfs`, whose layout is libc's business.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# 0.1, not 0.100: windows-version 0.100 is edition 2024 and needs Rust 1.95.
# The one call PULSE makes, `OsVersion::current()`, is identical in 0.1.7.
windows-version = "0.1"
# DXGI adapter enumeration is COM, which `windows-sys` deliberately does not
# cover. The `windows` crate is already in the dependency graph on Windows
# (Tauri pulls it in), so this adds correct COM lifetime handling and no build
# weight — and avoids hand-rolling vtable calls for an enumeration loop.
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi"] }
# Raw FFI bindings only — no wrapper layer, no runtime. Just the calls PULSE
# needs, behind exactly the features that declare them:
#   Threading           GetSystemTimes, OpenProcess, GetProcessTimes,
#                       GetProcessIoCounters, QueryFullProcessImageNameW,
#                       GetActiveProcessorCount
#   Diagnostics_ToolHelp  CreateToolhelp32Snapshot, Process32FirstW/NextW
#   ProcessStatus       K32GetProcessMemoryInfo
#   SystemInformation   GlobalMemoryStatusEx, GetLogicalProcessorInformationEx
#   LibraryLoader       GetModuleHandleW, GetProcAddress (runtime resolution)
#   Power               CallNtPowerInformation
#   Wdk_…               SystemProcessorPerformanceInformation
#   WindowsProgramming  SYSTEM_PROCESSOR_PERFORMANCE_INFORMATION
#   UI_Shell            SHGetKnownFolderPath (locating Program Files without
#                       trusting an inherited environment variable)
#   System_Com          CoTaskMemFree (freeing what that call allocates)
#   System_IO           DeviceIoControl (every storage query)
#   Storage_FileSystem  CreateFileW, the volume enumeration, GetDiskFreeSpaceExW
#   System_Ioctl        the storage and disk control codes' own declarations
#   Devices_…Installation  SetupDi* — enumerating the disks that are present
#   NetworkManagement_IpHelper  GetIfTable2, FreeMibTable
#   NetworkManagement_WiFi      WlanOpenHandle, WlanEnumInterfaces, WlanQueryInterface
#   Security_WinTrust           WinVerifyTrust, WTHelper* (the signer's certificate)
#   Security_Cryptography(_Catalog, _Sip)  CertGetNameStringW, CryptCATAdmin*,
#                               and the WTHelper* declarations that need both
#   Security_Authorization      ConvertSidToStringSidW (the owner's SID)
# Process control (TerminateProcess, SuspendThread, SetPriorityClass,
# SetProcessAffinityMask) needs no feature beyond Threading and ToolHelp.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Wdk_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
